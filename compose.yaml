services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: mapauto
      POSTGRES_DB: mapauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mapauto -d mapauto']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    image: mapauto-web:local
    environment: &app-env
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL DATABASE_URL in .env}
      COOKIE_SECURE: 'true'
      DEMO_MODE: 'false'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set public ALLOWED_HOSTS in .env}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db: {condition: service_healthy}
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
  api:
    image: mapauto-web:local
    environment: *app-env
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host':'localhost'}); urllib.request.urlopen(r)"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    image: mapauto-web:local
    environment: *app-env
    command: [python, -m, backend.app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  pgdata:
